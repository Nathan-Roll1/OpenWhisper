name: Check Fourier with the released Windows speech worker
on:
  push:
    branches: ['qa/fourier-native-worker']
permissions:
  contents: read
jobs:
  test-worker:
    if: github.repository == 'Nathan-Roll1/OpenWhisper'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check filelock certifi
      - run: python -u .fourier-worker-smoke.py
